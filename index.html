        // 渲染按钮
        function renderButtons(){
            // 经典分类
            C.classic.forEach(cat=>{
                const btn=document.createElement('button');
                btn.className='category-btn';
                btn.textContent=cat.name;
                btn.onclick=()=>displayClassic(cat);
                $('classic').appendChild(btn);
            });
            
            // 特色符号
            C.special.forEach(cat=>{
                const btn=document.createElement('button');
                btn.className='category-btn';
                btn.textContent=cat.name;
                btn.onclick=()=>cat.chars?displayClassic(cat):displayLazy(cat);
                $('special').appendChild(btn);
            });
            
            // Unicode平面
            C.plane.forEach(plane=>{
                const btn=document.createElement('button');
                btn.className='category-btn';
                btn.textContent=plane.name;
                btn.title=plane.desc||'';
                btn.onclick=()=>displayPlane(plane);
                $('plane').appendChild(btn);
            });
            
            // Unicode区块
            function renderBlocks(container,blocks){
                blocks.forEach(block=>{
                    const btn=document.createElement('button');
                    btn.className='category-btn';
                    btn.textContent=block.n;
                    btn.onclick=()=>displayLazy({name:block.n,start:block.s,end:block.e,batch:block.b});
                    container.appendChild(btn);
                });
            }
            
            renderBlocks($('european'),C.blocks.european);
            renderBlocks($('african'),C.blocks.african);
            renderBlocks($('westasian'),C.blocks.westasian);
            renderBlocks($('centralasian'),C.blocks.centralasian);
            renderBlocks($('southasian'),C.blocks.southasian);
            renderBlocks($('southeastasian'),C.blocks.southeastasian);
            renderBlocks($('eastasian'),C.blocks.eastasian);
            renderBlocks($('american'),C.blocks.american);
            renderBlocks($('symbols'),C.blocks.symbols);
            renderBlocks($('specials'),C.blocks.specials);
        }

        // 编码相关函数
        function updateEncoding(){
            currentEncoding=$('encoding-select').value;
            if(currentChar)showEncoding(currentChar);
        }

        function showEncoding(char){
            currentChar=char;
            const res=$('encoding-result'),info=$('char-info'),title=$('encoding-title'),bytes=$('encoding-bytes');
            res.classList.add('visible');
            const cp=char.codePointAt(0),hex=cp.toString(16).toUpperCase().padStart(4,'0');
            info.innerHTML=`<strong>字符： </strong>${char}<br><strong>Unicode：</strong>U+${hex} (${cp})<br><strong>UTF-16：</strong>${getUTF16(char)}`;
            title.textContent=`${currentEncoding}编码：`;
            bytes.textContent=getEncodedBytes(char,currentEncoding);
        }

        function getUTF16(char){
            const units=[];
            for(let i=0;i<char.length;i++)units.push('0x'+char.charCodeAt(i).toString(16).toUpperCase().padStart(4,'0'));
            return units.join(' ');
        }

        function getEncodedBytes(char,enc){
            const cp=char.codePointAt(0);
            try{
                if(enc==='UTF-8')return Array.from(new TextEncoder().encode(char)).map(b=>'0x'+b.toString(16).toUpperCase().padStart(2,'0')).join(' ');
                if(enc==='UTF-8-BOM')return '0xEF 0xBB 0xBF '+Array.from(new TextEncoder().encode(char)).map(b=>'0x'+b.toString(16).toUpperCase().padStart(2,'0')).join(' ');
                if(enc.startsWith('UTF-16')){
                    const b=[],le=enc==='UTF-16LE';
                    if(enc==='UTF-16')b.push(0xFE,0xFF);
                    if(cp<=0xFFFF){
                        const h=(cp>>8)&0xFF,l=cp&0xFF;
                        le?b.push(l,h):b.push(h,l);
                    }else{
                        const lead=0xD800+((cp-0x10000)>>10),trail=0xDC00+((cp-0x10000)&0x3FF);
                        const lh=(lead>>8)&0xFF,ll=lead&0xFF,th=(trail>>8)&0xFF,tl=trail&0xFF;
                        le?b.push(ll,lh,tl,th):b.push(lh,ll,th,tl);
                    }
                    return b.map(b=>'0x'+b.toString(16).toUpperCase().padStart(2,'0')).join(' ');
                }
                if(enc.startsWith('UTF-32')){
                    const b=[],le=enc==='UTF-32LE';
                    if(enc==='UTF-32')b.push(0x00,0x00,0xFE,0xFF);
                    const b1=(cp>>24)&0xFF,b2=(cp>>16)&0xFF,b3=(cp>>8)&0xFF,b4=cp&0xFF;
                    le?b.push(b4,b3,b2,b1):b.push(b1,b2,b3,b4);
                    return b.map(b=>'0x'+b.toString(16).toUpperCase().padStart(2,'0')).join(' ');
                }
                if(enc==='US-ASCII')return cp<=0x7F?'0x'+cp.toString(16).toUpperCase().padStart(2,'0'):'（不支持）';
                if(enc==='ISO-8859-1')return cp<=0xFF?'0x'+cp.toString(16).toUpperCase().padStart(2,'0'):'（不支持）';
                if(enc==='GB18030'){
                    if(cp<=0x7F)return '0x'+cp.toString(16).toUpperCase().padStart(2,'0');
                    if(cp>=0x4E00&&cp<=0x9FFF){
                        const off=cp-0x4E00,h=0x81+Math.floor(off/190),l=0x40+(off%190);
                        if(l>=0x7F)l++;
                        return '0x'+h.toString(16).toUpperCase().padStart(2,'0')+' 0x'+l.toString(16).toUpperCase().padStart(2,'0');
                    }
                    return '0x81 0x30 0x81 0x30';
                }
                if(enc==='GB2312'){
                    if(cp<=0x7F)return '0x'+cp.toString(16).toUpperCase().padStart(2,'0');
                    if(cp>=0x4E00&&cp<=0x9FA5){
                        const off=cp-0x4E00;
                        if(off<6763){
                            const h=0xB0+Math.floor(off/94),l=0xA1+(off%94);
                            return '0x'+h.toString(16).toUpperCase().padStart(2,'0')+' 0x'+l.toString(16).toUpperCase().padStart(2,'0');
                        }
                    }
                    return '（不支持）';
                }
                if(enc==='KOI8-R'){
                    if(cp<=0x7F)return '0x'+cp.toString(16).toUpperCase().padStart(2,'0');
                    const m={0x0410:0xE1,0x0411:0xE2,0x0412:0xF7,0x0413:0xE7,0x0414:0xE4,0x0415:0xE5,0x0416:0xF6,0x0417:0xFA,0x0418:0xE9,0x0419:0xEA,0x041A:0xEB,0x041B:0xEC,0x041C:0xED,0x041D:0xEE,0x041E:0xEF,0x041F:0xF0,0x0420:0xF2,0x0421:0xF3,0x0422:0xF4,0x0423:0xF5,0x0424:0xE6,0x0425:0xE8,0x0426:0xE3,0x0427:0xFE,0x0428:0xFB,0x0429:0xFD,0x042A:0xFF,0x042B:0xF9,0x042C:0xF8,0x042D:0xFC,0x042E:0xE0,0x042F:0xF1,0x0430:0xC1,0x0431:0xC2,0x0432:0xD7,0x0433:0xC7,0x0434:0xC4,0x0435:0xC5,0x0436:0xD6,0x0437:0xDA,0x0438:0xC9,0x0439:0xCA,0x043A:0xCB,0x043B:0xCC,0x043C:0xCD,0x043D:0xCE,0x043E:0xCF,0x043F:0xD0,0x0440:0xD2,0x0441:0xD3,0x0442:0xD4,0x0443:0xD5,0x0444:0xC6,0x0445:0xC8,0x0446:0xC3,0x0447:0xDE,0x0448:0xDB,0x0449:0xDD,0x044A:0xDF,0x044B:0xD9,0x044C:0xD8,0x044D:0xDC,0x044E:0xC0,0x044F:0xD1};
                    if(m[cp])return '0x'+m[cp].toString(16).toUpperCase().padStart(2,'0');
                    return '（不支持）';
                }
                return '0x'+cp.toString(16).toUpperCase().padStart(2,'0');
            }catch(e){return '编码失败: '+e.message}
        }

        // 显示函数
        function displayClassic(cat){
            lazyState={index:0,cat:null,loading:false};
            let html=getEncodingPanelHTML();
            html+=`<h2>${cat.name}</h2>`;
            
            if(cat.chars){
                html+=`<div class="info">共${cat.chars.length}个字符，点击复制</div><div class="char-grid">`;
                for(let i=0;i<cat.chars.length;i++){
                    const c=cat.chars[i];
                    html+=`<div class="char-item" onclick="handleClick('${c.replace(/'/g,"\\'")}')">${c}</div>`;
                }
                html+='</div>';
            }else if(cat.type==='lazy'){
                $('display').innerHTML=html;
                $('encoding-select').value=currentEncoding;
                $('encoding-select').onchange=updateEncoding;
                displayLazy(cat);
                return;
            }else if(cat.type==='gb2312'||cat.type==='gbk'){
                html+=`<div class="info">${cat.type==='gb2312'?'GB2312 6763字':'GBK 21003字'}（显示常用部分）</div><div class="char-grid">`;
                let cnt=0;
                for(let i=0x4E00;i<=0x9FFF&&cnt<2000;i++){
                    try{
                        const c=String.fromCodePoint(i);
                        html+=`<div class="char-item" title="U+${i.toString(16).toUpperCase()}" onclick="handleClick('${c}')">${c}</div>`;
                        cnt++;
                    }catch(e){}
                }
                html+='</div><div class="info">更多请查看"CJK统一汉字"</div>';
            }else if(cat.type==='emoji'){
                html+='<div class="info">常用Emoji表情，点击复制</div>';
                emojiRanges.forEach(r=>{
                    html+=`<h3 style="color:white;margin:15px 0 5px 0;font-size:14px;">${r.n}</h3><div class="char-grid">`;
                    for(let i=r.s;i<=r.e;i++){
                        try{
                            const c=String.fromCodePoint(i);
                            html+=`<div class="char-item" title="U+${i.toString(16).toUpperCase()}" onclick="handleClick('${c}')">${c}</div>`;
                        }catch(e){}
                    }
                    html+='</div>';
                });
            }else if(cat.type==='kaomoji'){
                html+=`<div class="info">共${kaomojis.length}个颜文字，点击复制</div><div class="char-grid" style="grid-template-columns: repeat(auto-fill, 60px);">`;
                kaomojis.forEach(k=>{
                    html+=`<div class="char-item kaomoji-item" onclick="handleClick('${k.replace(/'/g,"\\'")}')">${k}</div>`;
                });
                html+='</div>';
            }
            
            $('display').innerHTML=html;
            $('encoding-select').value=currentEncoding;
            $('encoding-select').onchange=updateEncoding;
        }

        function handleClick(char){
            showEncoding(char);
            copy(char);
        }

        function displayLazy(cat){
            lazyState={index:cat.start,cat:cat,loading:false};
            const name=cat.name,start=cat.start,end=cat.end,batch=cat.batch;
            let html=getEncodingPanelHTML();
            html+=`<h2>${name}</h2>`;
            html+=`<div class="info">U+${start.toString(16).toUpperCase().padStart(4,'0')} - U+${end.toString(16).toUpperCase().padStart(4,'0')}，每次加载${batch}个</div>`;
            html+='<div class="char-grid" id="char-grid"></div>';
            html+=`<button class="load-more-btn" id="load-more" onclick="loadMore()">加载更多 (每次${batch}个)</button>`;
            
            $('display').innerHTML=html;
            $('encoding-select').value=currentEncoding;
            $('encoding-select').onchange=updateEncoding;
            loadMore();
        }

        function displayPlane(plane){
            displayLazy({name:plane.name,start:plane.start,end:plane.end,batch:plane.batch});
        }

        function loadMore(){
            if(lazyState.loading||!lazyState.cat)return;
            const cat=lazyState.cat,grid=$('char-grid'),btn=$('load-more');
            if(!grid||!btn)return;
            lazyState.loading=true;
            btn.disabled=true;
            btn.textContent='加载中...';
            const start=lazyState.index,end=Math.min(start+cat.batch,cat.end+1);
            let html='',cnt=0;
            for(let i=start;i<end;i++){
                if((i>=0&&i<=31)||(i>=127&&i<=159)||(i>=0xD800&&i<=0xDFFF))continue;
                try{
                    const c=String.fromCodePoint(i);
                    const cls=cat.fancy?'char-item fancy-char-item':'char-item';
                    html+=`<div class="${cls}" title="U+${i.toString(16).toUpperCase()}" onclick="handleClick('${c}')">${c}</div>`;
                    cnt++;
                }catch(e){}
            }
            grid.insertAdjacentHTML('beforeend',html);
            lazyState.index=end;
            lazyState.loading=false;
            if(lazyState.index>cat.end){
                btn.style.display='none';
            }else{
                btn.disabled=false;
                const rem=cat.end-lazyState.index+1;
                btn.textContent=`加载更多 (剩余约${rem}个)`;
            }
        }

        function copy(text){
            navigator.clipboard.writeText(text).then(()=>{
                const t=document.createElement('div');
                t.style.cssText='position:fixed;background:#222;color:white;padding:15px;border-radius:5px;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;';
                t.textContent=`已复制: ${text}`;
                document.body.appendChild(t);
                setTimeout(()=>t.remove(),800);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded',()=>{
            renderButtons();
        });
    </script>
</body>
</html>
