        }

        }
        .section-title {

            font-weight: bold;

            background: #444;
            font-family: "Microsoft YaHei", "微软雅黑", "SimSun", "宋体", 'Noto Sans SC', sans-serif;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .category-btn {
            display: block;
            width: 100%;
            padding: 6px 8px;
            margin: 2px 0;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            font-family: "Microsoft YaHei", "微软雅黑", "SimSun", "宋体", 'Noto Sans SC', sans-serif;
        }
        .category-btn:hover {
            background: #444;
        }
        #display {
            flex: 1;
            background: #555;
            padding: 20px;
            min-height: 85vh;
            overflow-y: auto;
        }
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 50px);
            gap: 5px;
        }
        .char-item {
            width: 50px;
            height: 50px;
            background: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: white;
            border: 1px solid #777;
            font-family: "Microsoft YaHei", "微软雅黑", "SimSun", "宋体", 'Noto Sans Mono', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans Emoji', monospace;
        }

            background: #777;
        }

            aspect-ratio: 2/3;
            min-width: 60px;
            padding: 8px;
            font-size: 14px;
            white-space: normal;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

            margin: 20px auto;
            padding: 12px;
            background: #444;
            color: white;
            border: 1px solid #666;

        }

            margin-bottom: 8px;

        // 显示编码信息
        function showEncodingInfo(char) {
            currentChar = char;
            const resultDiv = document.getElementById('encoding-result');
            const charInfoDiv = document.getElementById('char-info');
            const encodingTitleDiv = document.getElementById('encoding-title');
            const encodingBytesDiv = document.getElementById('encoding-bytes');
            
            resultDiv.classList.add('visible');
            
            // 获取字符的Unicode信息
            const codePoint = char.codePointAt(0);
            const codePointHex = codePoint.toString(16).toUpperCase().padStart(4, '0');
            const codePointDec = codePoint;
            
            // 显示字符基本信息
            charInfoDiv.innerHTML = `
                <strong>字符：</strong>${char}<br>
                <strong>Unicode：</strong>U+${codePointHex} (${codePointDec})<br>
                <strong>UTF-16：</strong>${getUTF16Info(char)}
            `;
            
            // 更新编码标题
            encodingTitleDiv.textContent = `${currentEncoding} 编码：`;
            
            // 计算并显示编码字节
            const encodedBytes = getEncodedBytes(char, currentEncoding);
            encodingBytesDiv.textContent = encodedBytes;
        }

        // 获取UTF-16信息
        function getUTF16Info(char) {
            const codeUnits = [];
            for (let i = 0; i < char.length; i++) {
                codeUnits.push('0x' + char.charCodeAt(i).toString(16).toUpperCase().padStart(4, '0'));
            }
            return codeUnits.join(' ');
        }

        // 获取编码字节（模拟实现）
        function getEncodedBytes(char, encoding) {
            const codePoint = char.codePointAt(0);
            
            try {
                // 使用TextEncoder进行UTF-8编码
                if (encoding === 'UTF-8') {
                    const encoder = new TextEncoder();
                    const bytes = encoder.encode(char);
                    return Array.from(bytes).map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
                }
                
                // UTF-8 BOM
                if (encoding === 'UTF-8-BOM') {
                    const encoder = new TextEncoder();
                    const bytes = encoder.encode(char);
                    return '0xEF 0xBB 0xBF ' + Array.from(bytes).map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
                }
                
                // UTF-16系列
                if (encoding === 'UTF-16' || encoding === 'UTF-16BE' || encoding === 'UTF-16LE') {
                    const bytes = [];
                    const isLE = encoding === 'UTF-16LE';
                    
                    // 添加BOM（如果是UTF-16）
                    if (encoding === 'UTF-16') {
                        bytes.push(0xFE, 0xFF); // BE BOM
                    }
                    
                    if (codePoint <= 0xFFFF) {
                        // BMP字符
                        const high = (codePoint >> 8) & 0xFF;
                        const low = codePoint & 0xFF;
                        if (isLE) {
                            bytes.push(low, high);
                        } else {
                            bytes.push(high, low);
                        }
                    } else {
                        // 代理对
                        const lead = 0xD800 + ((codePoint - 0x10000) >> 10);
                        const trail = 0xDC00 + ((codePoint - 0x10000) & 0x3FF);
                        
                        const leadHigh = (lead >> 8) & 0xFF;
                        const leadLow = lead & 0xFF;
                        const trailHigh = (trail >> 8) & 0xFF;
                        const trailLow = trail & 0xFF;
                        
                        if (isLE) {
                            bytes.push(leadLow, leadHigh, trailLow, trailHigh);
                        } else {
                            bytes.push(leadHigh, leadLow, trailHigh, trailLow);
                        }
                    }
                    
                    return bytes.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
                }
                
                // UTF-32系列
                if (encoding === 'UTF-32' || encoding === 'UTF-32BE' || encoding === 'UTF-32LE') {
                    const bytes = [];
                    const isLE = encoding === 'UTF-32LE';
                    
                    // 添加BOM（如果是UTF-32）
                    if (encoding === 'UTF-32') {
                        bytes.push(0x00, 0x00, 0xFE, 0xFF); // BE BOM
                    }
                    
                    const b1 = (codePoint >> 24) & 0xFF;
                    const b2 = (codePoint >> 16) & 0xFF;
                    const b3 = (codePoint >> 8) & 0xFF;
                    const b4 = codePoint & 0xFF;
                    
                    if (isLE) {
                        bytes.push(b4, b3, b2, b1);
                    } else {
                        bytes.push(b1, b2, b3, b4);
                    }
                    
                    return bytes.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
                }
                
                // US-ASCII
                if (encoding === 'US-ASCII') {
                    if (codePoint <= 0x7F) {
                        return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
                    } else {
                        return '（不支持此字符）';
                    }
                }
                
                // ISO-8859-1 (Latin-1)
                if (encoding === 'ISO-8859-1') {
                    if (codePoint <= 0xFF) {
                        return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
                    } else {
                        return '（不支持此字符）';
                    }
                }
                
                // 其他编码的模拟实现
                const encodings = {
                    'GB18030': getGB18030Bytes,
                    'GB2312': getGB2312Bytes,
                    'Big5': getBig5Bytes,
                    'Shift_JIS': getShiftJISBytes,
                    'EUC-JP': getEUCJPBytes,
                    'EUC-KR': getEUCKRBytes,
                    'KOI8-R': getKOI8RBytes
                };
                
                if (encodings[encoding]) {
                    return encodings[encoding](codePoint, char);
                }
                
                // 对于其他编码，显示通用信息
                return `0x${codePoint.toString(16).toUpperCase().padStart(2, '0')} （${encoding}编码）`;
                
            } catch (e) {
                return '编码转换失败: ' + e.message;
            }
        }

        // GB18030编码（简化模拟）
        function getGB18030Bytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0x4E00 && codePoint <= 0x9FFF) {
                // CJK汉字 - 简化模拟
                const offset = codePoint - 0x4E00;
                const high = 0x81 + Math.floor(offset / 190);
                const low = 0x40 + (offset % 190);
                if (low >= 0x7F) low++;
                return '0x' + high.toString(16).toUpperCase().padStart(2, '0') + ' 0x' + low.toString(16).toUpperCase().padStart(2, '0');
            } else {
                return '0x81 0x30 0x81 0x30 （四字节序列，简化表示）';
            }
        }

        // GB2312编码（简化模拟）
        function getGB2312Bytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0x4E00 && codePoint <= 0x9FA5) {
                // GB2312汉字区 - 简化模拟
                const offset = codePoint - 0x4E00;
                if (offset < 6763) {
                    const high = 0xB0 + Math.floor(offset / 94);
                    const low = 0xA1 + (offset % 94);
                    return '0x' + high.toString(16).toUpperCase().padStart(2, '0') + ' 0x' + low.toString(16).toUpperCase().padStart(2, '0');
                }
            }
            return '（不支持此字符）';
        }

        // Big5编码（简化模拟）
        function getBig5Bytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0x4E00 && codePoint <= 0x9FFF) {
                // Big5汉字 - 简化模拟
                return '0xA4 0x40 （Big5编码，简化表示）';
            }
            return '（不支持此字符）';
        }

        // Shift_JIS编码（简化模拟）
        function getShiftJISBytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0xFF61 && codePoint <= 0xFF9F) {
                // 半角片假名
                return '0x' + (codePoint - 0xFF61 + 0xA1).toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0x4E00 && codePoint <= 0x9FFF) {
                return '0x88 0x9F （Shift_JIS编码，简化表示）';
            }
            return '（不支持此字符）';
        }

        // EUC-JP编码（简化模拟）
        function getEUCJPBytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0xFF61 && codePoint <= 0xFF9F) {
                return '0x8E 0x' + (codePoint - 0xFF61 + 0xA1).toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0x4E00 && codePoint <= 0x9FFF) {
                return '0xB0 0xA1 （EUC-JP编码，简化表示）';
            }
            return '（不支持此字符）';
        }

        // EUC-KR编码（简化模拟）
        function getEUCKRBytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0xAC00 && codePoint <= 0xD7AF) {
                return '0xB0 0xA1 （EUC-KR编码，简化表示）';
            }
            return '（不支持此字符）';
        }

        // KOI8-R编码（简化模拟）
        function getKOI8RBytes(codePoint, char) {
            if (codePoint <= 0x7F) {
                return '0x' + codePoint.toString(16).toUpperCase().padStart(2, '0');
            } else if (codePoint >= 0x0410 && codePoint <= 0x044F) {
                // 西里尔字母
                const koi8Map = {
                    0x0410: 0xE1, 0x0411: 0xE2, 0x0412: 0xF7, 0x0413: 0xE7,
                    0x0414: 0xE4, 0x0415: 0xE5, 0x0416: 0xF6, 0x0417: 0xFA,
                    0x0418: 0xE9, 0x0419: 0xEA, 0x041A: 0xEB, 0x041B: 0xEC,
                    0x041C: 0xED, 0x041D: 0xEE, 0x041E: 0xEF, 0x041F: 0xF0,
                    0x0420: 0xF2, 0x0421: 0xF3, 0x0422: 0xF4, 0x0423: 0xF5,
                    0x0424: 0xE6, 0x0425: 0xE8, 0x0426: 0xE3, 0x0427: 0xFE,
                    0x0428: 0xFB, 0x0429: 0xFD, 0x042A: 0xFF, 0x042B: 0xF9,
                    0x042C: 0xF8, 0x042D: 0xFC, 0x042E: 0xE0, 0x042F: 0xF1,
                    0x0430: 0xC1, 0x0431: 0xC2, 0x0432: 0xD7, 0x0433: 0xC7,
                    0x0434: 0xC4, 0x0435: 0xC5, 0x0436: 0xD6, 0x0437: 0xDA,
                    0x0438: 0xC9, 0x0439: 0xCA, 0x043A: 0xCB, 0x043B: 0xCC,
                    0x043C: 0xCD, 0x043D: 0xCE, 0x043E: 0xCF, 0x043F: 0xD0,
                    0x0440: 0xD2, 0x0441: 0xD3, 0x0442: 0xD4, 0x0443: 0xD5,
                    0x0444: 0xC6, 0x0445: 0xC8, 0x0446: 0xC3, 0x0447: 0xDE,
                    0x0448: 0xDB, 0x0449: 0xDD, 0x044A: 0xDF, 0x044B: 0xD9,
                    0x044C: 0xD8, 0x044D: 0xDC, 0x044E: 0xC0, 0x044F: 0xD1
                };
                if (koi8Map[codePoint]) {
                    return '0x' + koi8Map[codePoint].toString(16).toUpperCase().padStart(2, '0');
                }
            }
            return '（不支持此字符）';
        }

        // 显示经典分类
        function displayClassic(cat) {
            // 重置懒加载状态
            lazyLoadState = {
                currentIndex: cat.start || 0,
                currentCategory: cat,
                isLoading: false
            };

            let html = `<h2>${cat.name}</h2>`;
            
            if (cat.chars) {
                // 预定义字符集
                html += `<div class="info">共 ${cat.chars.length} 个字符，点击复制</div>`;
                html += '<div class="char-grid" id="char-grid">';
                for (let i = 0; i < cat.chars.length; i++) {
                    const char = cat.chars[i];
                    html += `<div class="char-item" onclick="handleCharClick('${char}')">${char}</div>`;
                }
                html += '</div>';
            } else if (cat.type === 'lazy-range') {
                // 懒加载范围（简体/繁体中文）
                displayLazyRange(cat);
                return;
            } else if (cat.type === 'gb2312' || cat.type === 'gbk') {
                // GB2312/GBK 模拟
                html += `<div class="info">${cat.type === 'gb2312' ? 'GB2312 6763个常用字' : 'GBK 21003个汉字'}（显示常用部分）</div>`;
                html += '<div class="char-grid" id="char-grid">';
                let count = 0;
                for (let i = 0x4E00; i <= 0x9FFF && count < 2000; i++) {
                    try {
                        const char = String.fromCodePoint(i);
                        html += `<div class="char-item" title="U+${i.toString(16).toUpperCase()}" onclick="handleCharClick('${char}')">${char}</div>`;
                        count++;
                    } catch (e) {}
                }
                html += '</div>';
                html += '<div class="info">...更多字符请查看"CJK统一汉字"区块</div>';
            } else if (cat.type === 'emoji') {
                // Emoji表情
                html += '<div class="info">包含所有常用Emoji表情，点击复制</div>';
                emojiRanges.forEach(range => {
                    html += `<h3 style="color:white;margin:15px 0 5px 0;font-size:14px;">${range.name}</h3>`;
                    html += '<div class="char-grid">';
                    for (let i = range.start; i <= range.end; i++) {
                        try {
                            const char = String.fromCodePoint(i);
                            html += `<div class="char-item" title="U+${i.toString(16).toUpperCase()}" onclick="handleCharClick('${char}')">${char}</div>`;
                        } catch (e) {}
                    }
                    html += '</div>';
                });
            } else if (cat.type === 'kaomoji') {
                // 颜文字（2:3比例）
                html += `<div class="info">共 ${kaomojis.length} 个颜文字（来自lddgo.net），点击复制</div>`;
                html += '<div class="char-grid" style="grid-template-columns: repeat(auto-fill, 60px);">';
                kaomojis.forEach(kaomoji => {
                    // 转义单引号防止JS错误
                    const escaped = kaomoji.replace(/'/g, "\\'");
                    html += `<div class="char-item kaomoji-item" onclick="handleCharClick('${escaped}')">${kaomoji}</div>`;
                });
                html += '</div>';
            }
            
            // 保留编码面板
            const encodingPanel = document.querySelector('.encoding-panel');
            displayDiv.innerHTML = '';
            displayDiv.appendChild(encodingPanel.cloneNode(true));
            displayDiv.insertAdjacentHTML('beforeend', html);
            
            // 重新绑定编码选择器事件
            document.getElementById('encoding-select').value = currentEncoding;
            document.getElementById('encoding-select').onchange = updateEncoding;
        }

        // 处理字符点击
        function handleCharClick(char) {
            showEncodingInfo(char);
            copyText(char);
        }

        // 通用懒加载显示函数（支持所有Unicode区块）
        function displayLazyRange(category) {
            // 重置懒加载状态
            lazyLoadState = {
                currentIndex: category.start,
                currentCategory: category,
                isLoading: false
            };

            let html = `<h2>${category.name}</h2>`;
            html += `<div class="info">U+${category.start.toString(16).toUpperCase().padStart(4, '0')} - U+${category.end.toString(16).toUpperCase().padStart(4, '0')}，每次加载${category.batchSize}个</div>`;
            html += '<div class="char-grid" id="char-grid"></div>';
            html += `<button class="load-more-btn" id="load-more-btn" onclick="loadMore()">加载更多 (每次${category.batchSize}个)</button>`;
            
            // 保留编码面板
            const encodingPanel = document.querySelector('.encoding-panel');
            displayDiv.innerHTML = '';
            displayDiv.appendChild(encodingPanel.cloneNode(true));
            displayDiv.insertAdjacentHTML('beforeend', html);
            
            // 重新绑定编码选择器事件
            document.getElementById('encoding-select').value = currentEncoding;
            document.getElementById('encoding-select').onchange = updateEncoding;
            
            // 立即加载第一批
            loadMore();
        }

        // 懒加载更多字符
        function loadMore() {
            if (lazyLoadState.isLoading) return;
            if (!lazyLoadState.currentCategory) return;
            
            const cat = lazyLoadState.currentCategory;
            const grid = document.getElementById('char-grid');
            const btn = document.getElementById('load-more-btn');
            
            if (!grid || !btn) return;
            
            lazyLoadState.isLoading = true;
            btn.disabled = true;
            btn.textContent = '加载中...';
            
            // 计算本次加载的结束位置
            const endIndex = Math.min(lazyLoadState.currentIndex + cat.batchSize, cat.end + 1);
            let loadedCount = 0;
            
            // 生成字符HTML
            let html = '';
            for (let i = lazyLoadState.currentIndex; i < endIndex; i++) {
                // 跳过控制字符和代理对
                if ((i >= 0x0000 && i <= 0x001F) || 
                    (i >= 0x007F && i <= 0x009F) ||
                    (i >= 0xD800 && i <= 0xDFFF)) {
                    continue;
                }
                
                try {
                    const char = String.fromCodePoint(i);
                    html += `<div class="char-item" title="U+${i.toString(16).toUpperCase()}" onclick="handleCharClick('${char}')">${char}</div>`;
                    loadedCount++;
                } catch (e) {}
            }
            
            // 添加到DOM
            grid.insertAdjacentHTML('beforeend', html);
            
            // 更新状态
            lazyLoadState.currentIndex = endIndex;
            lazyLoadState.isLoading = false;
            
            // 检查是否还有更多
            if (lazyLoadState.currentIndex > cat.end) {
                btn.style.display = 'none';
            } else {
                btn.disabled = false;
                const remaining = cat.end - lazyLoadState.currentIndex + 1;
                btn.textContent = `加载更多 (剩余约${remaining}个)`;
            }
        }

        // 复制文本（支持多字符颜文字）
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                const temp = document.createElement('div');
                temp.style.cssText = 'position:fixed;background:#222;color:white;padding:15px;border-radius:5px;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;';
                temp.textContent = `已复制: ${text}`;
                document.body.appendChild(temp);
                setTimeout(() => temp.remove(), 800);
            });
        }
    </script>
</body>
